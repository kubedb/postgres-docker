apiVersion: kubedb.com/v1
kind: Postgres
metadata:
  name: demo-tds-fdw
  namespace: demo
spec:
  version: "15.5-alpine-tds-fdw"
  replicas: 3
  standbyMode: Hot
  storageType: Durable
  storage:
    # storageClassName: "linode-block-storage"
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
  deletionPolicy: WipeOut
